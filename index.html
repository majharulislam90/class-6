<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="form-section">
        <div class="container">
            <div class="card">
                <div class="left">
                    <img src="img/office-work .avif" alt="" width="200px">
                </div>

                <div class="right">
                    <h2 style="font-family: poppinse font-weight: 500margin-bottom:10px ;;">Registration Form</h2>
                    <form>
                        <div class="name">
                            <input type="text" placeholder="First Name" class="fname">
                            <input type="text" placeholder="Last Name">
                        </div>
                        <div class="email">
                            <input type="email" placeholder="Enter your email ">
                        </div>
                        <div class="password">
                            <input type="password" placeholder="Enter a strong password ">
                        </div>
                        <div class="Date">
                            <input type="date">
                        </div>
                        <div class="gander">
                            <select name="Gander" id="">
                                <option> select your gander </option>
                                <option>Male </option>
                                <option>Female </option>
                                <option>Others </option>

                            </select>
                        </div>

                        <div class="condition">
                            <input type="checkbox">
                            <span> I agree with the condition </span>
                        </div>

                        <div class="submit">
                            <input type="submit" value="submit " class="s-btn">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
